name: erp-quiniela
services:
  mysql:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Configurar DB_NAME}
      MYSQL_USER: ${DB_USER:?Configurar DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Ejecutar npm run env:local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Ejecutar npm run env:local}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
volumes:
  mysql-data:
